<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Antes que cualquier CSS: lee el tema guardado y lo aplica ya, para que
       la página no "parpadee" oscuro-y-luego-claro en cada carga. El resto
       de la lógica (botón, guardar el cambio) vive en js/theme.js. -->
  <script>
    try {
      var theme = localStorage.getItem("caimanes-theme");
      if (theme === "eclipse") {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sin esto, iOS/Android detectan texto como "SS/LF/CF" o nombres+número
       como teléfono/dirección y los subrayan como link tocable — no son
       links reales, solo texto de stats. -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <title>Caimanes de Villas — Stats</title>

  <!-- Preview al compartir el link (WhatsApp, Facebook, X). La imagen y la URL
       tienen que ser absolutas: los scrapers no resuelven rutas relativas. -->
  <meta name="description" content="Estadísticas de los Caimanes de Villas: roster, bateo, pitcheo, fildeo, calendario y resultados de la temporada." />
  <meta name="theme-color" content="#0b0d10" />
  <link rel="canonical" href="https://ricardohdzm.github.io/caimanes-stats/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caimanes de Villas" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:title" content="Caimanes de Villas — Stats" />
  <meta property="og:description" content="Estadísticas de los Caimanes de Villas: roster, bateo, pitcheo, fildeo, calendario y resultados de la temporada." />
  <meta property="og:url" content="https://ricardohdzm.github.io/caimanes-stats/" />
  <meta property="og:image" content="https://ricardohdzm.github.io/caimanes-stats/assets/thumbnail.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logo de los Caimanes de Villas" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Caimanes de Villas — Stats" />
  <meta name="twitter:description" content="Estadísticas de los Caimanes de Villas: roster, bateo, pitcheo, fildeo, calendario y resultados de la temporada." />
  <meta name="twitter:image" content="https://ricardohdzm.github.io/caimanes-stats/assets/thumbnail.png" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Caimanes" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ya no hay pantalla de bienvenida ("Entrar"), a petición expresa: el
       sitio abre directo en la portada. js/splash.js sigue ahí y, al no
       encontrar #splash-gate, arranca la app de inmediato. Si algún día se
       reactiva Supabase y se quiere volver a tener login, hay que regresar
       el <div id="splash-gate"> (está en el historial de git). -->

  <!-- Restablecer contraseña ("¿Olvidaste tu contraseña?" — ver
       resetPassword en js/auth.js). Oculto por default: Supabase manda de
       vuelta aquí con un token de recuperación en la URL, y js/recovery.js
       lo destapa solo cuando de verdad hace falta. Sin video (mismo fondo
       de respaldo que #splash-gate cuando el video no cargó) — esta
       pantalla es rara, no necesita el mismo espectáculo. -->
  <div id="recovery-gate" class="splash-gate" hidden>
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <img src="assets/logo.png" alt="Caimanes de Villas" class="splash-logo" />
      <form id="recovery-form" class="splash-login-form">
        <label>Nueva contraseña<input type="password" name="password" minlength="6" required autocomplete="new-password"></label>
        <label>Confirmar contraseña<input type="password" name="password2" minlength="6" required autocomplete="new-password"></label>
        <p class="splash-login-error" id="recovery-error" hidden></p>
        <button type="submit" class="splash-btn splash-btn--accent">Guardar contraseña</button>
      </form>
    </div>
  </div>

  <!-- Estilo lyon.gg (a petición expresa): una barra "Match Center" con los
       resultados recientes y el próximo juego corriendo de lado (la arma
       js/main.js, ver buildTicker), y debajo un header delgado y pegajoso:
       logo + nombre a la izquierda y, en escritorio, las secciones en una
       fila (#tabs — js/main.js marca la activa y oculta las de solo-sesión).
       En celular/tablet esa fila se esconde y la navegación vive en el menú
       ☰ de pantalla completa (#more-sheet). -->
  <div class="match-ticker" id="match-ticker" aria-label="Match Center"></div>
  <header class="site-header">
    <a href="#/" class="site-brand" aria-label="Ir al inicio">
      <img src="assets/logos/whitelogo@2x.png" alt="" class="site-brand-logo" />
      <span class="site-brand-name">Caimanes</span>
    </a>
    <nav class="tabs site-nav" id="tabs" aria-label="Secciones">
      <a href="#/" data-route="home">Inicio</a>
      <a href="#/inicio" data-route="inicio">Feed</a>
      <a href="#" data-route="mi-perfil" id="nav-mi-perfil" hidden>Mi Perfil</a>
      <a href="#/roster" data-route="roster">Roster</a>
      <a href="#/resumen" data-route="resumen">Resumen</a>
      <a href="#/juegos" data-route="juegos">Juegos</a>
      <a href="#/calendario" data-route="calendario">Calendario</a>
      <a href="#/standing" data-route="standing">Standing</a>
      <a href="#/playoffs" data-route="playoffs">Playoffs</a>
      <a href="#/estadisticas" data-route="estadisticas">Estadísticas</a>
      <a href="#/temporadas" data-route="temporadas">Temporadas</a>
      <a href="#/alineacion" data-route="alineacion">Alineación</a>
      <a href="#/playlist" data-route="playlist">Playlist</a>
      <a href="#/fanzone" data-route="fanzone">Fanzone</a>
    </nav>
    <div class="site-header-actions">
      <!-- Vacío a propósito: js/auth.js lo llena (botón de cuenta) y lo deja
           vacío si Supabase no está configurado. -->
      <div id="auth-slot" class="auth-slot"></div>
      <!-- Solo escritorio (en celular viven en el menú ☰): Instagram y el
           interruptor de tema eclipse/luna (ver js/theme.js). -->
      <a href="https://www.instagram.com/caimanes.sb/" target="_blank" rel="noopener noreferrer" class="header-icon" aria-label="Instagram del equipo">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <button type="button" id="theme-toggle" class="theme-switch" aria-label="Tema: Luna — clic para cambiar">
        <span class="theme-switch-thumb"></span>
        <i class="fa-solid fa-circle-half-stroke theme-switch-icon theme-switch-icon--eclipse"></i>
        <i class="fa-solid fa-moon theme-switch-icon theme-switch-icon--moon"></i>
      </button>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <!-- Logos de patrocinadores — el contenedor va vacío a propósito,
         js/main.js lo llena desde SPONSORS (js/data.js); el título se deja
         fijo aquí porque no depende de ningún dato. -->
    <span class="footer-sponsors-title" id="footer-sponsors-title" hidden>Patrocinadores</span>
    <div class="footer-sponsors" id="footer-sponsors"></div>

    <div class="season-row">
      <span class="season" id="season-label"></span>
    </div>

    Caimanes de Villas © - <span id="footer-year"></span> - Diseñado por JRHM.STUDIO
  </footer>

  <!-- Solo se ven en celular (ver @media en styles.css); la nav de arriba
       sigue siendo la real en escritorio. Vacíos a propósito: js/main.js
       los arma desde BOTTOM_TABS/MORE_TABS, igual que #app se llena por
       código. #more-sheet va ANTES que la barra en el DOM para quedar
       apilado encima de ella sin necesitar z-index especial. -->
  <div id="more-sheet" class="more-sheet" hidden></div>
  <nav id="bottom-tabs" class="bottom-tabs"></nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
