<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Mismo script que index.html y fc.html: aplica el tema guardado antes
       del CSS. -->
  <script>
    var theme = "eclipse";
    try {
      var saved = localStorage.getItem("caimanes-theme");
      if (saved === "dark" || saved === "light") theme = saved;
    } catch (e) {}
    if (theme !== "dark") document.documentElement.dataset.theme = theme;
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <title>CaimanX Gaming — Caimanes.Team</title>
  <meta name="description" content="CaimanX Gaming, el equipo de gaming de Caimanes.Team en Culiacán: jugadores, juegos, torneos y overlays para stream en OBS." />
  <meta name="theme-color" content="#0a0e18" />
  <link rel="canonical" href="https://caimanes.team/caimanx.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caimanes.Team" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:title" content="CaimanX Gaming — Caimanes.Team" />
  <meta property="og:description" content="Jugadores, juegos, torneos y overlays para stream en OBS." />
  <meta property="og:url" content="https://caimanes.team/caimanx.html" />
  <meta property="og:image" content="https://caimanes.team/assets/thumbnail.png" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/caimanx.css" />
</head>
<body class="cx-site">
  <!-- CaimanX (gaming): mismo armado que index.html y fc.html (barra de
       arriba, header delgado con las secciones en fila y menú ☰, footer);
       lo llena js/caimanx/main.js con los datos de js/caimanx/data.js. -->
  <div class="match-ticker" id="match-ticker" aria-label="Torneos"></div>
  <header class="site-header">
    <a href="#/" class="site-brand" aria-label="CaimanX — ir al inicio">
      <img src="assets/logos/caimanx.png?v=5" alt="" class="site-brand-logo cx-brand-logo" />
    </a>
    <nav class="tabs site-nav" id="tabs" aria-label="Secciones"></nav>
    <div class="site-header-actions">
      <button type="button" id="theme-toggle" class="theme-switch" aria-label="Tema: Eclipse — clic para cambiar">
        <span class="theme-switch-thumb"></span>
        <i class="fa-solid fa-sun theme-switch-icon theme-switch-icon--sun"></i>
        <i class="fa-solid fa-circle-half-stroke theme-switch-icon theme-switch-icon--eclipse"></i>
        <i class="fa-solid fa-moon theme-switch-icon theme-switch-icon--moon"></i>
      </button>
      <!-- Solo en modo app (ver js/app-refresh.js). -->
      <button type="button" class="menu-toggle app-refresh" id="app-refresh" aria-label="Actualizar" title="Actualizar" hidden>
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-main">
        <div class="footer-brand">
          <a href="#/" class="footer-logo" aria-label="CaimanX — ir al inicio">
            <img src="assets/logos/caimanx.png?v=5" alt="" class="cx-footer-logo" />
            <span class="footer-wordmark">CaimanX <span>Gaming</span></span>
          </a>
          <p class="footer-about">El equipo de gaming de Caimanes.Team. Jugadores, torneos y overlays para stream.</p>
        </div>
        <nav class="footer-nav" id="footer-nav" aria-label="Secciones del sitio"></nav>
      </div>
      <div class="footer-bottom">
        <span class="cx-footer-socials" id="footer-socials"></span>
        <p class="footer-legal">CaimanX © <span id="footer-year"></span> · Diseñado por <a href="https://jrhm.studio/" target="_blank" rel="noopener noreferrer">JRHM.STUDIO</a></p>
      </div>
    </div>
  </footer>

  <div id="more-sheet" class="more-sheet" hidden></div>

  <script type="module" src="js/caimanx/main.js"></script>
</body>
</html>
